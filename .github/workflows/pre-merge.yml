name: pre-merge

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      local_ci_passed:
        description: "最終コミットでローカルCIが成功済み"
        required: true
        type: string
      merge_authorized:
        description: "ユーザーがmain統合前のGitHub CI実行を明示的に承認済み"
        required: true
        type: string
      source_branch:
        description: "mainへ統合する子孫ブランチ"
        required: true
        type: string
      target_branch:
        description: "統合先ブランチ"
        required: true
        type: string

permissions:
  contents: read

jobs:
  shared-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: main refを用意する
        run: |
          git fetch --no-tags --depth=1 origin main
          git branch main FETCH_HEAD
      - name: 手動起動時のローカルCI成功フラグを確認する
        if: github.event_name == 'workflow_dispatch'
        env:
          LOCAL_CI_PASSED: ${{ inputs.local_ci_passed }}
        run: test "$LOCAL_CI_PASSED" = true
      - name: 手動起動時のmain統合条件を確認する
        if: github.event_name == 'workflow_dispatch'
        env:
          MERGE_AUTHORIZED: ${{ inputs.merge_authorized }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          test "$MERGE_AUTHORIZED" = true
          test "$TARGET_BRANCH" = main
          test "$SOURCE_BRANCH" != main
      - name: 手動起動時のrelease PR gateを記録する
        if: github.event_name == 'workflow_dispatch'
        env:
          LOCAL_CI_PASSED: ${{ inputs.local_ci_passed }}
          MERGE_AUTHORIZED: ${{ inputs.merge_authorized }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: python3 scripts/release_pr_gate.py --json --output "${{ runner.temp }}/release-gate.json"
      - name: 共有CIポリシーと製品CIを検査する
        env:
          AGENT_CI_RESULT_FILE: ${{ github.workspace }}/.localci-result.json
        run: |
          for attempt in 1 2; do
            if bash scripts/run_ci_local_quiet.sh; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "Shared CI failed; retrying once for transient runner or service contention."
            fi
          done
          exit 1
      - name: GitHub status report
        if: always()
        env:
          AGENT_CI_RESULT_FILE: ${{ github.workspace }}/.localci-result.json
        run: |
          test -f "$AGENT_CI_RESULT_FILE"
          python3 scripts/github_status_report.py --input "$AGENT_CI_RESULT_FILE" --output "${{ runner.temp }}/github-status.json"
