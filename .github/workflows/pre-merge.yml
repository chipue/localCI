name: pre-merge

on:
  workflow_dispatch:
    inputs:
      local_ci_passed:
        description: "最終コミットでローカルCIが成功済み"
        required: true
        type: string
      merge_authorized:
        description: "ユーザーがmain統合前のGitHub CI実行を明示的に承認済み"
        required: true
        type: string
      source_branch:
        description: "mainへ統合する子孫ブランチ"
        required: true
        type: string
      target_branch:
        description: "統合先ブランチ"
        required: true
        type: string

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGENT_CI_RESULT_FILE: ${{ runner.temp }}/localci-result.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ローカルCI成功フラグを確認する
        env:
          LOCAL_CI_PASSED: ${{ inputs.local_ci_passed }}
        run: test "$LOCAL_CI_PASSED" = true
      - name: main統合前の実行条件を確認する
        env:
          MERGE_AUTHORIZED: ${{ inputs.merge_authorized }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          test "$MERGE_AUTHORIZED" = true
          test "$TARGET_BRANCH" = main
          test "$SOURCE_BRANCH" != main
      - name: release PR gateを記録する
        env:
          LOCAL_CI_PASSED: ${{ inputs.local_ci_passed }}
          MERGE_AUTHORIZED: ${{ inputs.merge_authorized }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: python3 scripts/release_pr_gate.py --json --output "${{ runner.temp }}/release-gate.json"
      - name: 共有CIポリシーと製品CIを検査する
        run: bash scripts/ci_local.sh
      - name: GitHub status report
        if: always()
        run: |
          test -f "$AGENT_CI_RESULT_FILE"
          python3 scripts/github_status_report.py --input "$AGENT_CI_RESULT_FILE" --output "${{ runner.temp }}/github-status.json"
