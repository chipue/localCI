schema_version: 1
policy_version: 0.1.0

project:
  name: localCI
  base_branch: main
  integration_prefix: integration/
  feature_prefix: feature/

# 空の導入直後は null のままにする。製品コード追加後にコマンドを設定する。
commands:
  install: null
  test: null
  typecheck: null
  build: null
  full_ci: null

github:
  enabled: true
  workflow_mode: pull_request
  timeout_minutes: 15

delivery:
  profile: delivery
  nightly_cron: "17 2 * * *"
  load_test_pushes: 300
  load_test_window_hours: 24
  runner_cost_per_minute: 0.008
  local_detection_rate: 0.9

storage:
  log_retention_days: 7
  result_cache_days: 7
